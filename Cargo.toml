[package]
name = "condor"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A lightweight folder-tree file viewer (Markdown, HTML, text, PDF) for Windows"

[dependencies]
wry = "0.58"
tao = "0.38"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "html", "regex-fancy"] }

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.18", default-features = false }
# Same version wry uses; for WebView2 events wry doesn't expose (focus).
webview2-com = "0.39"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
