<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Condor</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f7f7f8; --fg: #1f2328; --muted: #6e7781; --hover: #e8eaed; --sel: #d0e3ff; --cursor: #0969da;
  --border: #d0d7de; --split: #e1e4e8;
  --w: 300px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #181a1f; --fg: #d6dbe1; --muted: #8b949e; --hover: #262a31; --sel: #1f3b63; --cursor: #4493f8;
          --border: #30363d; --split: #2a2e35; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
  font: 13px/1.4 "Segoe UI", system-ui, sans-serif; user-select: none; }
#side { position: absolute; left: 0; top: 0; bottom: 0; width: var(--w); display: flex; flex-direction: column; }
#bar { display: flex; align-items: center; gap: 4px; padding: 6px 8px; border-bottom: 1px solid var(--border); }
#bar .spacer { flex: 1; }
#bar button { border: 0; background: none; color: var(--fg); font: inherit; font-size: 15px; width: 26px; height: 24px;
  border-radius: 4px; cursor: pointer; }
#bar button:hover { background: var(--hover); }
#bar button.on { background: var(--sel); color: var(--cursor); }
#tree { flex: 1; overflow: auto; padding: 4px 0 24px; outline: none; }
#split { position: absolute; top: 0; bottom: 0; left: var(--w); width: 5px; cursor: col-resize; background: var(--split); }
#split:hover, #split.drag { background: var(--cursor); }
#split { box-shadow: inset -1px 0 var(--border); }
/* Each pane: a bar with the file's name and controls, an optional banner, and a frame whose
   1px top line shows above the document (the document view covers the rest). */
.pframe { position: absolute; background: var(--border); }
.pane-focus .pframe { background: var(--cursor); }
.pbar { position: absolute; height: 32px; display: flex; align-items: center; gap: 2px; padding: 0 6px;
  background: var(--bg); overflow: hidden; }
.pbar .pname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 6px; font-weight: 600; }
.pbar button { border: 0; background: none; color: var(--fg); font: inherit; font-size: 15px; min-width: 26px; height: 24px;
  border-radius: 4px; cursor: pointer; padding: 0 4px; flex: none; }
.pbar button:hover { background: var(--hover); }
.pbar button.on { background: var(--sel); color: var(--cursor); }
.pbar button:disabled { opacity: .35; cursor: default; }
.pbar button:disabled:hover { background: none; }
.pbar .b-auto, .pbar .b-src, .pbar .b-office { font-size: 11px; }
.pbar .b-src { font-family: ui-monospace, Consolas, monospace; }
.split-pane:not(.pane-focus) .pname { color: var(--muted); font-weight: 400; }
#pdiv { position: absolute; background: var(--split); }
#pdiv.v { cursor: col-resize; } #pdiv.h { cursor: row-resize; }
#pdiv:hover, #pdiv.drag { background: var(--cursor); }
body.popout #side, body.popout #split { display: none; }
.row { display: flex; align-items: center; height: 22px; padding-right: 6px; white-space: nowrap; cursor: default; border: 1px solid transparent; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--sel); }
#tree:focus .row.cursor { border-color: var(--cursor); }
.tw { width: 16px; flex: none; text-align: center; color: var(--muted); font-size: 10px; }
.name { overflow: hidden; text-overflow: ellipsis; }
/* File names shrink in the middle: the end of the name and its extension stay visible. */
.fname { display: flex; min-width: 0; }
.fname .stem { overflow: hidden; text-overflow: ellipsis; white-space: pre; }
.fname .tail { flex: none; white-space: pre; }
.row.noview .fname { color: var(--muted); }
.root > .row { font-weight: 600; margin-top: 2px; }
/* A root's name keeps its room; its path gives way first, losing its start (the end, nearest
   the folder, is the telling part). */
.root > .row > .name:not(.full) { flex: 0 0 auto; max-width: 75%; }
.root > .row .full { font-weight: 400; color: var(--muted); margin-left: 6px; overflow: hidden; text-overflow: ellipsis;
  min-width: 0; flex: 0 1 auto; direction: rtl; text-align: left; }
.row .x { margin-left: auto; visibility: hidden; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 4px; font-size: 14px; }
.root > .row:hover .x { visibility: visible; }
.row .x:hover { color: var(--fg); }
.note { color: var(--muted); font-style: italic; }
.err { color: #cf222e; font-style: italic; }
.hidden { display: none !important; }
#empty { padding: 24px 16px; color: var(--muted); }
#empty button { margin-top: 8px; font: inherit; padding: 4px 10px; }
#fpanel, #spanel { padding: 8px 10px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
#fpanel label, #spanel label { display: flex; align-items: center; gap: 6px; }
#fpanel .flabel, #spanel .flabel { margin-top: 4px; color: var(--muted); }
#fpanel textarea, #spanel textarea { width: 100%; font: 12px ui-monospace, Consolas, monospace; resize: vertical; background: var(--bg);
  color: var(--fg); border: 1px solid var(--border); border-radius: 4px; padding: 4px; user-select: text; }
#fpanel .fbtns, #spanel .fbtns { display: flex; justify-content: flex-end; }
#fpanel button, #spanel button { font: inherit; padding: 2px 12px; }
.pbanner { position: absolute; height: 34px; display: flex; align-items: center;
  gap: 8px; padding: 0 10px; background: #fff8c5; color: #3b2300; border-top: 1px solid #d4a72c; white-space: nowrap; overflow: hidden; }
@media (prefers-color-scheme: dark) { .pbanner { background: #3a2f0b; color: #f2e3b3; border-color: #9e6a03; } }
.pbanner.info { background: #ddf4ff; color: #0a3069; border-color: #54aeff; }
.pbanner.info button { border-color: #0969da; }
.pbanner.info button:hover { background: rgba(9,105,218,.15); }
@media (prefers-color-scheme: dark) { .pbanner.info { background: #0c2d4a; color: #cae8ff; border-color: #1f6feb; } .pbanner.info button { border-color: #4493f8; } }
#menu { position: fixed; z-index: 10; min-width: 150px; padding: 4px 0; background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
#menu button { display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--fg); font: inherit; padding: 4px 14px; cursor: pointer; }
#menu button:hover { background: var(--hover); }
.pbanner .msg { overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
.pbanner button { font: inherit; padding: 2px 10px; border-radius: 4px; border: 1px solid #bf8700; background: transparent; color: inherit; cursor: pointer; }
.pbanner button:hover { background: rgba(191,135,0,.2); }
.pbanner .close { margin-left: auto; border: 0; font-size: 16px; padding: 0 6px; }
#bar #update { width: auto; padding: 0 8px; font-size: 12px; background: #1f883d; color: #fff; border-radius: 12px; margin-right: 4px; }
#bar #update:hover { background: #1a7f37; }
.dragover > .row { box-shadow: inset 0 2px 0 var(--cursor); }
#bar #gear svg { display: block; margin: auto; }
/* Tags: badges on tree rows, the filter bar, the tag editor. Each tag gets a hue from its name. */
.tag { flex: none; margin-left: 5px; padding: 0 6px; border-radius: 8px; font-size: 11px; line-height: 16px;
  background: hsl(var(--h) 70% 90%); color: hsl(var(--h) 60% 28%); }
@media (prefers-color-scheme: dark) { .tag { background: hsl(var(--h) 35% 24%); color: hsl(var(--h) 70% 82%); } }
.star { flex: none; margin-left: 5px; color: #d4a017; }
#sbar { padding: 6px 8px; border-bottom: 1px solid var(--border); display: flex; gap: 4px; }
#q { flex: 1; min-width: 0; font: inherit; padding: 4px 8px; border: 1px solid var(--border); border-radius: 4px;
  background: var(--bg); color: var(--fg); user-select: text; }
#q:focus { outline: none; border-color: var(--cursor); }
#qclear { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; }
#results { flex: 1; overflow: auto; padding: 2px 0 24px; outline: none; }
#results .status { padding: 6px 10px; color: var(--muted); font-size: 12px; }
.hit { padding: 5px 10px 6px; cursor: default; border-left: 3px solid transparent; }
.hit:hover { background: var(--hover); }
.hit.sel { background: var(--sel); border-left-color: var(--cursor); }
.hit .hname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; }
.hit .hname > span:first-child { overflow: hidden; text-overflow: ellipsis; }
.hit .hpath { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.hit .hsnip { font-size: 12px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 1px; }
.hit mark { background: #fff0a8; color: #3b2300; border-radius: 2px; padding: 0 1px; }
@media (prefers-color-scheme: dark) { .hit mark { background: #6b5500; color: #fff3c4; } }
#tagbar { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 8px; border-bottom: 1px solid var(--border); }
#tagbar .tag { margin: 0; cursor: pointer; line-height: 20px; padding: 0 8px; border: 1px solid transparent; opacity: .75; }
#tagbar .tag.on { border-color: currentColor; opacity: 1; font-weight: 600; }
#tagbar .clear { margin: 0; border: 0; background: none; color: var(--muted); cursor: pointer; font: inherit; font-size: 11px; }
#tagbar .clear:hover { color: var(--fg); }
#tagbox { position: fixed; z-index: 11; width: 230px; padding: 8px; background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.18); display: flex; flex-direction: column; gap: 3px; }
#tagbox .tb-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 4px; }
#tagbox label { display: flex; align-items: center; gap: 6px; }
#tagbox .tb-list { max-height: 260px; overflow: auto; display: flex; flex-direction: column; gap: 3px; }
#tagbox .tb-new { margin-top: 4px; font: inherit; padding: 3px 6px; background: var(--bg); color: var(--fg);
  border: 1px solid var(--border); border-radius: 4px; user-select: text; }
#spanel .stype { color: var(--muted); padding-left: 22px; }
#spanel .stype button { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 4px; font-size: 14px; }
#spanel .stype button:hover { color: var(--fg); }
.pbar .ploading { flex: none; color: var(--muted); font-size: 12px; padding: 0 8px; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.pbar .pflash { flex: none; color: #1a7f37; font-size: 12px; padding: 0 8px; }
@media (prefers-color-scheme: dark) { .pbar .pflash { color: #3fb950; } }
.pbar .b-copy svg { display: block; margin: auto; }
#flash { position: absolute; left: 12px; bottom: 12px; z-index: 20; max-width: calc(var(--w) - 24px); padding: 5px 10px;
  border-radius: 6px; background: var(--fg); color: var(--bg); font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#menu .kbd { float: right; margin-left: 18px; color: var(--muted); font-size: 11px; }
#menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }
.pbar .b-star.on { color: #d4a017; background: none; }
.pbar .b-tags { font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
<div id="side">
  <div id="bar">
    <button id="update" class="hidden" title="A new version of Condor is installed: restart into it (keeps your place)">Restart</button>
    <span class="spacer"></span>
    <button id="filter" title="Filters: hidden files, file types, exclusions">&#x29e9;</button>
    <button id="add" title="Add a folder (root)">+</button>
    <button id="gear" title="Settings (shared by all Condor windows)"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><mask id="gear-hole"><rect width="24" height="24" fill="#fff"/><circle cx="12" cy="12" r="3.2" fill="#000"/></mask><g fill="currentColor" mask="url(#gear-hole)"><circle cx="12" cy="12" r="7.2"/><rect x="10.1" y="1.6" width="3.8" height="5" rx="1"/><rect x="10.1" y="1.6" width="3.8" height="5" rx="1" transform="rotate(45 12 12)"/><rect x="10.1" y="1.6" width="3.8" height="5" rx="1" transform="rotate(90 12 12)"/><rect x="10.1" y="1.6" width="3.8" height="5" rx="1" transform="rotate(135 12 12)"/><rect x="10.1" y="1.6" width="3.8" height="5" rx="1" transform="rotate(180 12 12)"/><rect x="10.1" y="1.6" width="3.8" height="5" rx="1" transform="rotate(225 12 12)"/><rect x="10.1" y="1.6" width="3.8" height="5" rx="1" transform="rotate(270 12 12)"/><rect x="10.1" y="1.6" width="3.8" height="5" rx="1" transform="rotate(315 12 12)"/></g></svg></button>
  </div>
  <div id="fpanel" class="hidden">
    <label><input type="checkbox" id="f-hidden"> Show hidden files (dot files)</label>
    <label><input type="checkbox" id="f-ignored"> Hide git-ignored files</label>
    <label><input type="checkbox" id="f-viewable"> Only viewable file types</label>
    <div class="flabel">Exclude (one pattern per line, .gitignore syntax):</div>
    <textarea id="f-excludes" rows="4" spellcheck="false" placeholder="node_modules/&#10;target/&#10;*.lock"></textarea>
    <div class="fbtns"><button id="f-apply">Apply</button></div>
  </div>
  <div id="spanel" class="hidden">
    <div class="flabel">Document width:</div>
    <label><input type="radio" name="s-width" value="wide"> Wide tables and code; text at reading width</label>
    <label><input type="radio" name="s-width" value="full"> Full width</label>
    <label><input type="radio" name="s-width" value="narrow"> Reading width only</label>
    <div class="flabel">Office documents (.docx, .xlsx, .vsd, ...):</div>
    <label><input type="radio" name="s-office" value="auto"> Windows previewer if installed, else LibreOffice</label>
    <label><input type="radio" name="s-office" value="libreoffice"> LibreOffice (converted to PDF)</label>
    <label><input type="radio" name="s-office" value="previewer"> Windows previewer only</label>
    <label><input type="radio" name="s-office" value="off"> Don't show them</label>
    <div id="s-types"></div>
    <div class="flabel">Viewable file types (for "Only viewable file types"):</div>
    <textarea id="s-exts" rows="4" spellcheck="false"></textarea>
    <div class="fnote">Shared by all Condor windows.</div>
    <div class="fbtns"><button id="s-apply">Apply</button></div>
  </div>
  <div id="sbar"><input id="q" type="text" spellcheck="false" placeholder="Search names and contents (Ctrl+Shift+F)"><button id="qclear" class="hidden" title="Back to the tree (Esc)">&#x00d7;</button></div>
  <div id="tagbar" class="hidden"></div>
  <div id="results" class="hidden" tabindex="0"></div>
  <div id="tree" tabindex="0"></div>
</div>
<div id="split"></div>
<div id="panes"></div>
<div id="pdiv" class="hidden"></div>
<div id="menu" class="hidden">
  <button id="m-star">Star</button>
  <button id="m-tags">Tags&#x2026;</button>
  <hr class="m-file">
  <button id="m-other" class="m-file">Open in other pane</button>
  <button id="m-window" class="m-file">Open in new window</button>
  <button id="m-open" class="m-file">Open in default app</button>
  <button id="m-openwith" class="m-file">Open with&#x2026;</button>
  <button id="m-terminal" class="m-dir">Open in Terminal</button>
  <hr>
  <button id="m-copy">Copy <span class="kbd">Ctrl+C</span></button>
  <button id="m-copypath">Copy path <span class="kbd">Ctrl+Shift+C</span></button>
</div>
<div id="flash" class="hidden"></div>
<template id="pane-tpl">
  <div class="pgroup">
    <div class="pframe"></div>
    <div class="pbar">
      <button class="b-back" title="Back (Alt+Left)">&#x2190;</button>
      <button class="b-fwd" title="Forward (Alt+Right)">&#x2192;</button>
      <span class="pname"></span><span class="ploading hidden">loading…</span><span class="pflash hidden"></span>
      <button class="b-copy" title="Copy the selection, or the whole document"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="5.5" y="5.5" width="8" height="9" rx="1.5"/><path d="M10.5 3.5v-1a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h1"/></svg></button>
      <button class="b-star" title="Star this file">&#x2606;</button>
      <button class="b-tags" title="Tags">#</button>
      <button class="b-office hidden"></button>
      <button class="b-src hidden" title="View source (Ctrl+U)">&lt;/&gt;</button>
      <button class="b-auto" title="Reload this file automatically when it changes">AUTO</button>
      <button class="b-reload" title="Reload (F5)">&#x21bb;</button>
      <button class="b-split main-only" title="Split">&#x25eb;</button>
      <button class="b-pop main-only" title="Open in a new window">&#x29c9;</button>
      <button class="b-close main-only hidden" title="Close this pane">&#x00d7;</button>
    </div>
    <div class="pbanner hidden">
      <span class="msg"></span>
      <button class="bb-reload">Reload</button>
      <button class="bb-auto" title="Reload this file automatically from now on">Always auto-reload this file</button>
      <button class="bb-open" title="Open in its default application">Open</button>
      <button class="bb-openwith" title="Choose an application to open it with">Open with&#x2026;</button>
      <button class="close bb-close" title="Dismiss">&#x00d7;</button>
    </div>
  </div>
</template>
<div id="tagbox" class="hidden">
  <div class="tb-title"></div>
  <label><input type="checkbox" class="tb-star"> <span class="star" style="margin:0">&#x2605;</span> Starred</label>
  <div class="tb-list"></div>
  <input class="tb-new" placeholder="New tag, then Enter" spellcheck="false">
</div>
<script>
"use strict";
const post = (o) => window.ipc.postMessage(JSON.stringify(o));
const tree = document.getElementById("tree");
const nodes = new Map();      // path -> node element
const loaded = new Set();     // paths whose children have been listed at least once
let expanded = new Set();
let selected = null;
let cursor = null;            // keyboard cursor (a .node element)
let roots = [];
let reveal = false;           // scroll the selected file into view when it first appears

function baseName(p) {
  const t = p.replace(/[\\/]+$/, "");
  const i = Math.max(t.lastIndexOf("\\"), t.lastIndexOf("/"));
  return i >= 0 ? t.slice(i + 1) || t : t;
}

function makeNode(path, name, dir, depth, isRoot, synth) {
  const n = document.createElement("div");
  n.className = "node" + (isRoot ? " root" : "");
  n.dataset.path = path;
  if (synth) n.dataset.synth = "1";   // a folder on the way to tagged items (filtered tree)
  n.dataset.dir = dir ? "1" : "";
  n.dataset.depth = depth;
  const row = document.createElement("div");
  row.className = "row";
  row.style.paddingLeft = (depth * 14 + 4) + "px";
  row.title = path;
  const tw = document.createElement("span");
  tw.className = "tw";
  tw.textContent = dir ? "▸" : "";
  const nm = document.createElement("span");
  nm.className = "name";
  if (dir) nm.textContent = name;
  else {
    // Keep the extension and the few characters before it whole (e.g. "…dec v2.xlsx").
    const dot = name.lastIndexOf(".");
    const cut = Math.max(0, (dot > 0 ? dot : name.length) - 6);
    const stem = document.createElement("span"), tail = document.createElement("span");
    stem.className = "stem"; stem.textContent = name.slice(0, cut);
    tail.className = "tail"; tail.textContent = name.slice(cut);
    nm.className = "name fname";
    nm.append(stem, tail);
  }
  row.append(tw, nm);
  if (isRoot) {
    const full = document.createElement("span");
    full.className = "full name";
    full.textContent = "\u200e" + path + "\u200e"; // marks keep the path in order under rtl
    const x = document.createElement("button");
    x.className = "x";
    x.title = "Remove this folder from the list";
    x.textContent = "×";
    x.addEventListener("click", (e) => { e.stopPropagation(); post({cmd: "removeRoot", path}); });
    row.append(full, x);
    row.draggable = true;
  }
  n.append(row);
  if (dir) {
    const kids = document.createElement("div");
    kids.className = synth ? "kids" : "kids hidden";
    n.append(kids);
    if (synth) tw.textContent = "▾";
  }
  decorate(n);
  if (path === selected) {
    row.classList.add("sel");
    if (reveal) { reveal = false; setTimeout(() => { row.scrollIntoView({block: "center"}); setCursor(n, false); }, 0); }
  }
  nodes.set(path, n);
  return n;
}

function kidsOf(n) { return n.querySelector(":scope > .kids"); }
function rowOf(n) { return n.querySelector(":scope > .row"); }

function setOpen(n, open, user) {
  if (!n.dataset.dir) return;
  const path = n.dataset.path;
  const kids = kidsOf(n);
  kids.classList.toggle("hidden", !open);
  rowOf(n).querySelector(".tw").textContent = open ? "▾" : "▸";
  if (n.dataset.synth) return;   // holds only the tagged items, not a listing
  if (open) {
    if (!loaded.has(path) && !kids.firstChild) {
      const l = document.createElement("div");
      l.className = "row note";
      l.style.paddingLeft = ((+n.dataset.depth + 1) * 14 + 20) + "px";
      l.textContent = "loading…";
      kids.append(l);
    }
    // Always re-list on expand so the tree picks up changes on disk.
    post({cmd: "list", path});
  }
  if (user) {
    if (open) expanded.add(path); else expanded.delete(path);
    post({cmd: "expand", path, open});
  }
}

function onList(msg) {
  const n = nodes.get(msg.path);
  if (!n) return;
  const kids = kidsOf(n);
  const depth = +n.dataset.depth + 1;
  loaded.add(msg.path);
  if (msg.error) {
    kids.replaceChildren();
    const e = document.createElement("div");
    e.className = "row err";
    e.style.paddingLeft = (depth * 14 + 20) + "px";
    e.textContent = msg.error;
    e.title = msg.error;
    kids.append(e);
    return;
  }
  // Reuse existing child nodes so their own expanded subtrees survive a refresh.
  const old = new Map();
  for (const c of kids.children) if (c.dataset && c.dataset.path) old.set(c.dataset.path, c);
  const frag = [];
  for (const ent of msg.entries) {
    let c = old.get(ent.path);
    if (c && !!c.dataset.dir === ent.dir) {
      old.delete(ent.path);
    } else {
      c = makeNode(ent.path, ent.name, ent.dir, depth, false);
      if (ent.dir && expanded.has(ent.path)) setOpen(c, true, false);
    }
    frag.push(c);
  }
  for (const [p, c] of old) forget(c);
  kids.replaceChildren(...frag);
  if (!msg.entries.length) {
    const e = document.createElement("div");
    e.className = "row note";
    e.style.paddingLeft = (depth * 14 + 20) + "px";
    e.textContent = "(empty)";
    kids.append(e);
  }
  if (cursor && !cursor.isConnected) cursor = null;
  if (revealing && isWithin(revealing, msg.path)) revealStep();
}

function forget(n) {
  for (const d of n.querySelectorAll(".node")) nodes.delete(d.dataset.path);
  nodes.delete(n.dataset.path);
}

// ----- Tags and stars -------------------------------------------------------------------
let tags = {};          // path -> {dir, tags: [...]}
let tagFilter = [];     // the tree shows only items with any of these
let STAR = "★";
let showable = new Set();   // extensions Condor highlights (besides the viewable list)
let treeMode = "all";
function tagsOf(p) { const t = p && tags[p]; return t ? t.tags : []; }
function hue(s) { let h = 7; for (const c of s) h = (h * 31 + c.codePointAt(0)) % 360; return h; }
function tagEl(t) {
  const b = document.createElement("span");
  b.className = "tag";
  b.textContent = t;
  b.style.setProperty("--h", hue(t));
  return b;
}
function allTags() {
  const set = new Set();
  for (const v of Object.values(tags)) for (const t of v.tags) if (t !== STAR) set.add(t);
  return [...set].sort((a, b) => a.localeCompare(b, undefined, {sensitivity: "base"}));
}
function isViewable(name) {
  // No extension (README, LICENSE) is usually text.
  const dot = name.lastIndexOf(".");
  if (dot < 0) return true;
  const ext = name.slice(dot + 1).toLowerCase();
  return showable.has(ext) || settings.viewable_exts.some((e) => e.trim().replace(/^\./, "").toLowerCase() === ext);
}
// Badges after a row's name, and the dimming of files Condor can't show.
function decorate(n) {
  const row = rowOf(n);
  if (!row) return;
  for (const b of row.querySelectorAll(":scope > .tag, :scope > .star")) b.remove();
  if (!n.dataset.dir) row.classList.toggle("noview", !isViewable(baseName(n.dataset.path)));
  const t = tagsOf(n.dataset.path);
  if (!t.length) return;
  const x = row.querySelector(":scope > .x");
  const add = (el) => x ? row.insertBefore(el, x) : row.append(el);
  if (t.includes(STAR)) {
    const st = document.createElement("span");
    st.className = "star"; st.textContent = STAR; st.title = "Starred";
    add(st);
  }
  for (const tg of t) if (tg !== STAR) add(tagEl(tg));
}
function setTags(path, dir, list) { post({cmd: "setTags", path, dir: !!dir, tags: list}); }
function toggleStar(path, dir) {
  const t = tagsOf(path);
  setTags(path, dir, t.includes(STAR) ? t.filter((x) => x !== STAR) : [...t, STAR]);
}

function renderTagbar() {
  const bar = document.getElementById("tagbar");
  const names = allTags();
  const anyStar = Object.values(tags).some((v) => v.tags.includes(STAR));
  bar.replaceChildren();
  bar.classList.toggle("hidden", !names.length && !anyStar && !tagFilter.length);
  const chip = (t, label) => {
    const c = tagEl(label || t);
    if (t === STAR) c.style.setProperty("--h", 45);
    c.classList.toggle("on", tagFilter.includes(t));
    c.title = tagFilter.includes(t) ? "Stop filtering by this" : "Show only items with this (or another selected) tag";
    c.onclick = () => post({cmd: "tagFilter", tags: tagFilter.includes(t) ? tagFilter.filter((x) => x !== t) : [...tagFilter, t]});
    bar.append(c);
  };
  if (anyStar) chip(STAR, STAR + " starred");
  for (const t of names) chip(t);
  if (tagFilter.length) {
    const c = document.createElement("button");
    c.className = "clear"; c.textContent = "show all";
    c.onclick = () => post({cmd: "tagFilter", tags: []});
    bar.append(c);
  }
}

function onTags(msg) {
  tags = msg.tags || {};
  const oldFilter = tagFilter.join("\n");
  tagFilter = msg.filter || [];
  renderTagbar();
  if (tagFilter.length || oldFilter !== tagFilter.join("\n")) renderRoots();
  else for (const n of nodes.values()) decorate(n);
  for (const id of paneEls.keys()) showPaneTags(id);
  if (!tagbox.classList.contains("hidden")) fillTagbox();
}

// The tree filtered by tag: each root shows the folders leading to matching items. Matching
// folders are ordinary folders (their full contents when opened).
function renderTagged() {
  const match = (p) => tagsOf(p).some((t) => tagFilter.includes(t));
  const want = Object.keys(tags).filter(match).sort((a, b) => a.length - b.length);
  const els = [];
  for (const r of roots) {
    const mine = want.filter((p) => isWithin(p, r));
    if (!mine.length) continue;
    if (mine.some((p) => keyOf(p) === keyOf(r))) {
      const n = makeNode(r, baseName(r), true, 0, true);
      if (expanded.has(r)) setOpen(n, true, false);
      els.push(n);
      continue;
    }
    const rn = makeNode(r, baseName(r), true, 0, true, true);
    const sep = r.includes("\\") ? "\\" : "/";
    for (const p of mine) {
      const segs = p.slice(r.length).split(/[\\/]+/).filter(Boolean);
      let cur = rn, curPath = r.replace(/[\\/]+$/, "");
      for (let i = 0; i < segs.length; i++) {
        const last = i === segs.length - 1;
        const childPath = last ? p : curPath + sep + segs[i];
        let c = [...kidsOf(cur).children].find((k) => keyOf(k.dataset.path) === keyOf(childPath));
        if (c) { if (!c.dataset.synth) break; cur = c; curPath = childPath; continue; }   // inside a tagged folder
        if (last) {
          c = makeNode(p, baseName(p), tags[p].dir, i + 1, false);
          if (c.dataset.dir && expanded.has(p)) setOpen(c, true, false);
        } else c = makeNode(childPath, segs[i], true, i + 1, false, true);
        kidsOf(cur).append(c);
        cur = c; curPath = childPath;
      }
    }
    const sortKids = (n) => {
      const k = kidsOf(n);
      const list = [...k.children].sort((a, b) => (!!b.dataset.dir - !!a.dataset.dir) ||
        baseName(a.dataset.path).localeCompare(baseName(b.dataset.path), undefined, {sensitivity: "base"}));
      k.replaceChildren(...list);
      for (const c of list) if (c.dataset.synth) sortKids(c);
    };
    sortKids(rn);
    els.push(rn);
  }
  tree.replaceChildren(...els);
  if (!els.length) {
    const e = document.createElement("div");
    e.id = "empty";
    e.textContent = "Nothing in these folders has the selected tags.";
    tree.append(e);
  }
}

function clearTree() {
  for (const c of [...tree.children]) if (c.dataset && c.dataset.path) forget(c);
  tree.replaceChildren();
  cursor = null;
}

function renderRoots() {
  const mode = tagFilter.length ? "tagged" : "all";
  if (mode !== treeMode || mode === "tagged") clearTree();
  treeMode = mode;
  if (mode === "tagged") { renderTagged(); return; }
  const keep = new Map();
  for (const c of tree.children) if (c.dataset && c.dataset.path) keep.set(c.dataset.path, c);
  const els = [];
  for (const r of roots) {
    let n = keep.get(r);
    if (n) keep.delete(r);
    else {
      n = makeNode(r, baseName(r), true, 0, true);
      if (expanded.has(r)) setOpen(n, true, false);
    }
    els.push(n);
  }
  for (const [, n] of keep) forget(n);
  tree.replaceChildren(...els);
  if (!roots.length) {
    const e = document.createElement("div");
    e.id = "empty";
    e.innerHTML = "No folders yet.<br>";
    const b = document.createElement("button");
    b.textContent = "Add a folder…";
    b.onclick = () => post({cmd: "addRoot"});
    e.append(b);
    tree.append(e);
  }
}

function select(path) {
  if (selected && nodes.get(selected)) rowOf(nodes.get(selected)).classList.remove("sel");
  selected = path;
  const n = path && nodes.get(path);
  if (n) {
    rowOf(n).classList.add("sel");
    if (!cursor) setCursor(n, false);
  }
  revealPath(path);
}

// Expand the folders leading to `path` (listing them as needed) and scroll it into view,
// e.g. after following a link in a document. Stops quietly if a filter hides it.
let revealing = null, revealLast = null;
function keyOf(p) { return p.toLowerCase().replace(/[\\/]+$/, ""); }
function isWithin(p, a) {
  const kp = keyOf(p), ka = keyOf(a);
  return kp === ka || kp.startsWith(ka + "\\") || kp.startsWith(ka + "/");
}
function revealPath(path) {
  revealing = path || null;
  revealLast = null;
  revealStep();
}
function revealStep() {
  if (!revealing) return;
  let best = null;
  for (const [p, n] of nodes) {
    if (n.isConnected && isWithin(revealing, p) && (!best || p.length > best.dataset.path.length)) best = n;
  }
  if (!best) { revealing = null; return; }
  if (keyOf(best.dataset.path) === keyOf(revealing)) {
    revealing = null;
    const row = rowOf(best);
    if (row.offsetParent !== null) row.scrollIntoView({block: "nearest"});
    return;
  }
  // Already opened and listed this folder, and the target isn't in it: give up.
  if (best === revealLast && loaded.has(best.dataset.path)) { revealing = null; return; }
  revealLast = best;
  const open = !kidsOf(best).classList.contains("hidden");
  if (!open) setOpen(best, true, true);           // its listing arrives in onList, which calls us
  else if (loaded.has(best.dataset.path)) revealStep();
}

function setCursor(n, scroll) {
  if (cursor && cursor.isConnected) rowOf(cursor).classList.remove("cursor");
  cursor = n;
  if (n) {
    rowOf(n).classList.add("cursor");
    if (scroll) rowOf(n).scrollIntoView({block: "nearest"});
  }
}

function activate(n) {
  if (n.dataset.dir) setOpen(n, kidsOf(n).classList.contains("hidden"), true);
  else post({cmd: "open", path: n.dataset.path});
}

tree.addEventListener("click", (e) => {
  const row = e.target.closest(".row");
  if (!row || !row.parentElement.classList.contains("node")) return;
  const n = row.parentElement;
  setCursor(n, false);
  activate(n);
});

function visibleNodes() {
  const out = [];
  const walk = (container) => {
    for (const c of container.children) {
      if (!c.classList || !c.classList.contains("node")) continue;
      out.push(c);
      const k = kidsOf(c);
      if (k && !k.classList.contains("hidden")) walk(k);
    }
  };
  walk(tree);
  return out;
}

tree.addEventListener("keydown", (e) => {
  if (e.altKey) return; // Alt+arrows are back/forward
  const vis = visibleNodes();
  if (!vis.length) return;
  let i = cursor ? vis.indexOf(cursor) : -1;
  const n = cursor;
  switch (e.key) {
    case "ArrowDown": setCursor(vis[Math.min(i + 1, vis.length - 1)], true); break;
    case "ArrowUp": setCursor(vis[Math.max(i - 1, 0)], true); break;
    case "Home": setCursor(vis[0], true); break;
    case "End": setCursor(vis[vis.length - 1], true); break;
    case "PageDown": setCursor(vis[Math.min(i + 20, vis.length - 1)], true); break;
    case "PageUp": setCursor(vis[Math.max(i - 20, 0)], true); break;
    case "ArrowRight":
      if (n && n.dataset.dir) {
        if (kidsOf(n).classList.contains("hidden")) setOpen(n, true, true);
        else if (vis[i + 1] && vis[i + 1].parentElement === kidsOf(n)) setCursor(vis[i + 1], true);
      }
      break;
    case "ArrowLeft":
      if (n && n.dataset.dir && !kidsOf(n).classList.contains("hidden")) setOpen(n, false, true);
      else if (n && n.parentElement.classList.contains("kids")) setCursor(n.parentElement.parentElement, true);
      break;
    case "Enter": case " ": if (n) activate(n); break;
    case "F5": post({cmd: "reload"}); break;
    case "*": if (n) toggleStar(n.dataset.path, !!n.dataset.dir); break;
    case "c": case "C":
      // Ctrl+C copies the file (or folder) itself; Ctrl+Shift+C its path.
      if (!n || !e.ctrlKey || e.altKey) return;
      post({cmd: e.shiftKey ? "copyPath" : "copyFile", path: n.dataset.path});
      break;
    default: return;
  }
  e.preventDefault();
});

document.addEventListener("keydown", (e) => {
  if (e.ctrlKey && !e.altKey && !e.shiftKey && (e.key === "u" || e.key === "U")) {
    post({cmd: "toggleSource"});
    e.preventDefault();
    return;
  }
  if (e.altKey && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
    post({cmd: e.key === "ArrowLeft" ? "back" : "forward"});
    e.preventDefault();
    return;
  }
  if (e.key === "F5" && e.target !== tree) { post({cmd: "reload"}); e.preventDefault(); }
});

// Reorder roots by dragging their header rows.
let dragRoot = null;
tree.addEventListener("dragstart", (e) => {
  const n = e.target.closest && e.target.closest(".root");
  if (!n) return;
  dragRoot = n.dataset.path;
  e.dataTransfer.effectAllowed = "move";
});
tree.addEventListener("dragover", (e) => {
  const n = e.target.closest && e.target.closest(".root");
  if (!dragRoot || !n) return;
  e.preventDefault();
  for (const r of tree.querySelectorAll(".dragover")) r.classList.remove("dragover");
  n.classList.add("dragover");
});
tree.addEventListener("drop", (e) => {
  const n = e.target.closest && e.target.closest(".root");
  for (const r of tree.querySelectorAll(".dragover")) r.classList.remove("dragover");
  if (!dragRoot || !n) return;
  e.preventDefault();
  let to = roots.indexOf(n.dataset.path);
  post({cmd: "moveRoot", path: dragRoot, to});
  dragRoot = null;
});
tree.addEventListener("dragend", () => { dragRoot = null; });

// Panes: the bar above each document (its file and the file's controls), its banner, and
// the divider of a split. Rust sends the geometry ("layout") and each pane's state.
const MODE = new URLSearchParams(location.search).get("mode") || "main";
if (MODE === "popout") document.body.classList.add("popout");
const PANE_BAR = 32, BANNER = 34;
const panesEl = document.getElementById("panes");
const paneEls = new Map();     // id -> {group, bar, banner, state}
let canOpenWith = false;

function paneEl(id) {
  let p = paneEls.get(id);
  if (p) return p;
  const group = document.getElementById("pane-tpl").content.firstElementChild.cloneNode(true);
  const q = (c) => group.querySelector(c);
  p = {group, bar: q(".pbar"), frame: q(".pframe"), banner: q(".pbanner"), state: {}, bannerMsg: null};
  const send = (cmd, extra) => post(Object.assign({cmd, pane: id}, extra || {}));
  p.bar.addEventListener("mousedown", () => post({cmd: "focus", pane: id}));
  q(".b-back").onclick = () => send("back");
  q(".b-fwd").onclick = () => send("forward");
  q(".b-src").onclick = () => send("toggleSource");
  q(".b-reload").onclick = () => send("reload");
  q(".b-copy").onclick = () => send("copyPane");
  q(".b-office").onclick = () => send("officeView", {mode: p.state.office === "previewer" ? "libreoffice" : "previewer"});
  q(".b-auto").onclick = () => { if (p.state.file) post({cmd: "autoReload", path: p.state.file, on: !p.state.auto}); };
  q(".b-split").onclick = () => send("split");
  q(".b-pop").onclick = () => send("popOut");
  q(".b-close").onclick = () => send("closePane");
  q(".b-star").onclick = () => { if (p.state.file) toggleStar(p.state.file, false); };
  q(".b-tags").onclick = (e) => {
    if (!p.state.file) return;
    const r = e.currentTarget.getBoundingClientRect();
    openTagbox(p.state.file, false, r.right - 230, r.bottom + 2, id);
  };
  q(".b-tags").addEventListener("mousedown", (e) => e.stopPropagation());   // don't close the box it opens
  q(".bb-reload").onclick = () => send("reload");
  q(".bb-auto").onclick = () => { if (p.state.file) post({cmd: "autoReload", path: p.state.file, on: true}); };
  q(".bb-close").onclick = () => send("dismiss");
  q(".bb-open").onclick = () => post({cmd: "openExternal", path: p.bannerMsg.path, with: false});
  q(".bb-openwith").onclick = () => post({cmd: "openExternal", path: p.bannerMsg.path, with: true});
  for (const b of group.querySelectorAll(".main-only")) if (MODE !== "main") b.remove();
  panesEl.append(group);
  paneEls.set(id, p);
  return p;
}

function place(el, x, y, w, h) {
  el.style.left = x + "px"; el.style.top = y + "px"; el.style.width = Math.max(0, w) + "px";
  if (h !== undefined) el.style.height = Math.max(0, h) + "px";
}

let lastLayout = null;
function onLayout(msg) {
  lastLayout = msg;
  const live = new Set();
  for (const r of msg.panes) {
    live.add(r.id);
    const p = paneEl(r.id);
    p.group.classList.toggle("pane-focus", r.focused && msg.split);
    p.group.classList.toggle("split-pane", msg.split);
    place(p.frame, r.x, r.y, r.w, r.h);
    place(p.bar, r.x, r.y, r.w, PANE_BAR);
    place(p.banner, r.x, r.y + PANE_BAR, r.w, BANNER);
    const sb = p.group.querySelector(".b-split");
    if (sb) {
      sb.innerHTML = !msg.split ? "&#x25eb;" : msg.sideBySide ? "&#x229f;" : "&#x25eb;";
      sb.title = !msg.split ? "Split into two panes" : msg.sideBySide ? "Stack the panes" : "Put the panes side by side";
    }
    const cb = p.group.querySelector(".b-close");
    if (cb) cb.classList.toggle("hidden", !msg.split);
  }
  for (const [id, p] of paneEls) if (!live.has(id)) { p.group.remove(); paneEls.delete(id); }
  const d = document.getElementById("pdiv");
  d.classList.toggle("hidden", !msg.divider);
  if (msg.divider) {
    place(d, msg.divider.x, msg.divider.y, msg.divider.w, msg.divider.h);
    d.classList.toggle("v", msg.sideBySide);
    d.classList.toggle("h", !msg.sideBySide);
  }
}

function onPane(msg) {
  const p = paneEl(msg.id);
  p.state = msg;
  const q = (c) => p.group.querySelector(c);
  q(".pname").textContent = msg.file ? baseName(msg.file) : "";
  q(".pname").title = msg.file || "";
  q(".ploading").classList.toggle("hidden", !msg.loading);
  const src = q(".b-src");
  src.classList.toggle("hidden", !msg.canSource);
  src.classList.toggle("on", !!msg.source);
  src.title = msg.source ? "Show the rendered view (Ctrl+U)" : "View source (Ctrl+U)";
  const office = q(".b-office");
  office.classList.toggle("hidden", !msg.office);
  office.textContent = msg.office === "previewer" ? "PDF" : "PREVIEW";
  const ext = msg.file ? "." + (msg.file.split(".").pop() || "").toLowerCase() : "";
  office.title = msg.office === "previewer" ? "Show " + ext + " files converted to PDF by LibreOffice"
                                            : "Show " + ext + " files with the Windows (Office) previewer";
  const auto = q(".b-auto");
  auto.disabled = !msg.file;
  auto.classList.toggle("on", !!msg.auto);
  showPaneTags(msg.id);
  auto.title = msg.auto ? "This file reloads automatically when it changes (click to stop)"
                        : "Reload this file automatically when it changes";
}

function showPaneTags(id) {
  const p = paneEls.get(id);
  if (!p) return;
  const f = p.state.file;
  const t = tagsOf(f);
  const star = p.group.querySelector(".b-star"), tg = p.group.querySelector(".b-tags");
  star.disabled = tg.disabled = !f;
  const on = t.includes(STAR);
  star.classList.toggle("on", on);
  star.textContent = on ? "\u2605" : "\u2606";
  star.title = on ? "Starred (click to unstar)" : "Star this file";
  const names = t.filter((x) => x !== STAR);
  tg.classList.toggle("on", names.length > 0);
  tg.title = names.length ? "Tags: " + names.join(", ") : "Tags";
}

function onHistory(msg) {
  const p = paneEl(msg.id);
  p.group.querySelector(".b-back").disabled = !msg.back;
  p.group.querySelector(".b-fwd").disabled = !msg.forward;
}

function onBanner(msg) {
  const p = paneEl(msg.pane);
  p.banner.classList.toggle("hidden", !msg.show);
  if (!msg.show) { p.bannerMsg = null; return; }
  p.bannerMsg = msg;
  const name = baseName(msg.path);
  const open = msg.kind === "open", conv = msg.kind === "converting";
  const q = (c) => p.banner.querySelector(c);
  p.banner.classList.toggle("info", open || conv);
  q(".msg").textContent = open ? "Condor can't show " + name + "."
    : conv ? "Converting " + name + " with LibreOffice\u2026"
    : msg.deleted ? name + " was deleted or moved. You are viewing the last version loaded."
    : name + " has changed on disk.";
  q(".bb-reload").classList.toggle("hidden", open || conv || !!msg.deleted);
  q(".bb-auto").classList.toggle("hidden", open || conv || !!msg.deleted);
  q(".bb-open").classList.toggle("hidden", !open);
  q(".bb-openwith").classList.toggle("hidden", !open || !msg.openWith);
  q(".bb-close").title = open ? "Dismiss" : "Keep viewing this version";
}

// Dragging the divider between two panes.
{
  const d = document.getElementById("pdiv");
  let raf = null;
  d.addEventListener("pointerdown", (e) => { d.setPointerCapture(e.pointerId); d.classList.add("drag"); });
  d.addEventListener("pointermove", (e) => {
    if (!d.hasPointerCapture(e.pointerId) || !lastLayout) return;
    const a = lastLayout.area;
    const ratio = lastLayout.sideBySide ? (e.clientX - a.x) / a.w : (e.clientY - a.y) / a.h;
    if (raf === null) raf = requestAnimationFrame(() => { raf = null; post({cmd: "paneRatio", ratio}); });
  });
  d.addEventListener("pointerup", (e) => { d.releasePointerCapture(e.pointerId); d.classList.remove("drag"); });
}

// Search: words matched against file names, folders and contents (Office files and PDFs
// too). Results replace the tree until the search is cleared.
const qEl = document.getElementById("q"), resultsEl = document.getElementById("results");
let searchId = 0, searchTimer = null, lastQuery = "";
function showResults(on) {
  resultsEl.classList.toggle("hidden", !on);
  tree.classList.toggle("hidden", on);
  document.getElementById("qclear").classList.toggle("hidden", !on);
}
function runSearch() {
  clearTimeout(searchTimer);
  const q = qEl.value.trim();
  if (!q) { clearSearch(false); return; }
  if (q === lastQuery && !resultsEl.classList.contains("hidden")) return;
  lastQuery = q;
  searchId++;
  showResults(true);
  resultsEl.replaceChildren(Object.assign(document.createElement("div"), {className: "status", textContent: "Searching…"}));
  post({cmd: "search", query: q, id: searchId});
}
function clearSearch(focusTree) {
  clearTimeout(searchTimer);
  searchId++;
  lastQuery = "";
  qEl.value = "";
  showResults(false);
  if (focusTree) tree.focus();
}
function onResults(msg) {
  if (msg.id !== searchId) return;   // a newer search is running
  const frag = [];
  const st = document.createElement("div");
  st.className = "status";
  st.textContent = msg.hits.length ? msg.hits.length + (msg.hits.length >= 60 ? "+" : "") + " found (" + (msg.ms / 1000).toFixed(1) + " s)"
                                    : "Nothing found for “" + msg.query + "”.";
  frag.push(st);
  for (const h of msg.hits) {
    const d = document.createElement("div");
    d.className = "hit" + (h.path === selected ? " sel" : "");
    d.dataset.path = h.path;
    d.title = h.path;
    const name = document.createElement("div");
    name.className = "hname";
    const nm = document.createElement("span");
    nm.textContent = h.name;
    name.append(nm);
    const t = tagsOf(h.path);
    if (t.includes(STAR)) name.append(Object.assign(document.createElement("span"), {className: "star", textContent: STAR}));
    for (const tg of t) if (tg !== STAR) name.append(tagEl(tg));
    const path = document.createElement("div");
    path.className = "hpath";
    path.textContent = "‎" + h.folder;   // rtl box keeps the end visible; the mark keeps text order
    d.append(name, path);
    if (h.snippet.length) {
      const sn = document.createElement("div");
      sn.className = "hsnip";
      for (const [text, m] of h.snippet) sn.append(m ? Object.assign(document.createElement("mark"), {textContent: text}) : document.createTextNode(text));
      d.append(sn);
    }
    frag.push(d);
  }
  resultsEl.replaceChildren(...frag);
}
resultsEl.addEventListener("click", (e) => {
  const h = e.target.closest(".hit");
  if (!h) return;
  for (const o of resultsEl.querySelectorAll(".hit.sel")) o.classList.remove("sel");
  h.classList.add("sel");
  post({cmd: "open", path: h.dataset.path});
});
resultsEl.addEventListener("contextmenu", (e) => {
  const h = e.target.closest(".hit");
  if (!h) return;
  e.preventDefault();
  openMenu(h.dataset.path, false, e.clientX, e.clientY);
});
resultsEl.addEventListener("keydown", (e) => {
  const all = [...resultsEl.querySelectorAll(".hit")];
  let i = all.findIndex((h) => h.classList.contains("sel"));
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    i = Math.max(0, Math.min(all.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)));
    if (all[i]) { all[i].click(); all[i].scrollIntoView({block: "nearest"}); }
    e.preventDefault();
  } else if (e.key === "Escape") clearSearch(true);
});
qEl.addEventListener("input", () => {
  clearTimeout(searchTimer);
  if (!qEl.value.trim()) { clearSearch(false); return; }
  if (qEl.value.trim().length >= 3) searchTimer = setTimeout(runSearch, 450);
});
qEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { lastQuery = ""; runSearch(); e.preventDefault(); }
  else if (e.key === "Escape") { clearSearch(true); e.preventDefault(); }
  else if (e.key === "ArrowDown" && !resultsEl.classList.contains("hidden")) {
    resultsEl.focus();
    const first = resultsEl.querySelector(".hit");
    if (first && !resultsEl.querySelector(".hit.sel")) first.click();
    e.preventDefault();
  }
});
document.getElementById("qclear").onclick = () => clearSearch(true);
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey && e.shiftKey && (e.key === "F" || e.key === "f")) { qEl.focus(); qEl.select(); e.preventDefault(); }
});

// The tag editor: star, existing tags as checkboxes, and a box for a new one.
const tagbox = document.getElementById("tagbox");
let tbPath = null, tbDir = false, tbPane = null;
// Popups can't draw over documents (they are separate views on top of this page), so ones
// opened from the sidebar stay inside it, and the tag editor opened from a pane's bar has
// the pane make room for it.
function sideRight() { return MODE === "main" ? currentWidth() : innerWidth; }
function fitPopup(el, x, y, inSide) {
  const right = inSide ? sideRight() : innerWidth;
  el.style.maxWidth = Math.max(120, right - 8) + "px";
  const r = el.getBoundingClientRect();
  el.style.left = Math.max(4, Math.min(x, right - r.width - 4)) + "px";
  el.style.top = Math.max(4, Math.min(y, innerHeight - r.height - 4)) + "px";
}
function paneInset() {
  if (tbPane === null || tagbox.classList.contains("hidden")) return;
  const p = paneEls.get(tbPane), r = lastLayout && lastLayout.panes.find((q) => q.id === tbPane);
  if (!p || !r) return;
  const docTop = r.y + PANE_BAR + (p.bannerMsg ? BANNER : 0);
  const bottom = tagbox.getBoundingClientRect().bottom + 6;
  post({cmd: "paneInset", pane: tbPane, px: Math.max(0, Math.ceil(bottom - docTop))});
}
function fillTagbox() {
  const have = tagsOf(tbPath);
  tagbox.querySelector(".tb-title").textContent = baseName(tbPath);
  tagbox.querySelector(".tb-title").title = tbPath;
  tagbox.querySelector(".tb-star").checked = have.includes(STAR);
  const list = tagbox.querySelector(".tb-list");
  list.replaceChildren();
  for (const t of allTags()) {
    const l = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = have.includes(t);
    cb.onchange = () => {
      const cur = tagsOf(tbPath);
      setTags(tbPath, tbDir, cb.checked ? [...cur, t] : cur.filter((x) => x !== t));
    };
    l.append(cb, tagEl(t));
    list.append(l);
  }
  paneInset();   // a new tag makes the box taller
}
function openTagbox(path, dir, x, y, pane) {
  hideTagbox();
  tbPath = path; tbDir = dir; tbPane = pane === undefined ? null : pane;
  fillTagbox();
  tagbox.classList.remove("hidden");
  if (tbPane === null) fitPopup(tagbox, x, y, true);
  else {
    const r = tagbox.getBoundingClientRect();
    tagbox.style.maxWidth = "";
    tagbox.style.left = Math.max(4, Math.min(x, innerWidth - r.width - 4)) + "px";
    tagbox.style.top = y + "px";
    paneInset();
  }
  const input = tagbox.querySelector(".tb-new");
  input.value = "";
  input.focus();
}
function hideTagbox() {
  if (tbPane !== null && !tagbox.classList.contains("hidden")) post({cmd: "paneInset", pane: tbPane, px: 0});
  tagbox.classList.add("hidden");
  tbPane = null;
}
tagbox.querySelector(".tb-star").onchange = (e) => {
  const cur = tagsOf(tbPath).filter((x) => x !== STAR);
  setTags(tbPath, tbDir, e.target.checked ? [...cur, STAR] : cur);
};
tagbox.querySelector(".tb-new").addEventListener("keydown", (e) => {
  if (e.key === "Escape") { hideTagbox(); return; }
  if (e.key !== "Enter") return;
  const t = e.target.value.trim().replace(/\s+/g, " ");
  if (t && t !== STAR) {
    const cur = tagsOf(tbPath);
    if (!cur.includes(t)) setTags(tbPath, tbDir, [...cur, t]);
  }
  e.target.value = "";
});
document.addEventListener("mousedown", (e) => { if (!tagbox.contains(e.target)) hideTagbox(); });
window.addEventListener("blur", hideTagbox);

// Right-click an item in the tree: star or tag it; for files, open it elsewhere.
let menuPath = null, menuDir = false;
const menu = document.getElementById("menu");
function hideMenu() { menu.classList.add("hidden"); }
tree.addEventListener("contextmenu", (e) => {
  e.preventDefault();
  const row = e.target.closest(".row");
  const n = row && row.parentElement;
  if (!n || !n.classList.contains("node")) { hideMenu(); return; }
  openMenu(n.dataset.path, !!n.dataset.dir, e.clientX, e.clientY);
});
function openMenu(path, dir, x, y) {
  menuPath = path;
  menuDir = dir;
  for (const el of menu.querySelectorAll(".m-file")) el.classList.toggle("hidden", menuDir);
  for (const el of menu.querySelectorAll(".m-dir")) el.classList.toggle("hidden", !menuDir);
  document.getElementById("m-openwith").classList.toggle("hidden", menuDir || !canOpenWith);
  document.getElementById("m-star").textContent = tagsOf(menuPath).includes(STAR) ? "Unstar" : "Star";
  menu.dataset.x = x; menu.dataset.y = y;
  menu.classList.remove("hidden");
  fitPopup(menu, x, y, true);
}
document.getElementById("m-star").onclick = () => { hideMenu(); toggleStar(menuPath, menuDir); };
document.getElementById("m-tags").onclick = () => { hideMenu(); openTagbox(menuPath, menuDir, +menu.dataset.x, +menu.dataset.y); };
document.getElementById("m-open").onclick = () => { hideMenu(); post({cmd: "openExternal", path: menuPath, with: false}); };
document.getElementById("m-other").onclick = () => { hideMenu(); post({cmd: "openOther", path: menuPath}); };
document.getElementById("m-window").onclick = () => { hideMenu(); post({cmd: "popOut", path: menuPath}); };
document.getElementById("m-openwith").onclick = () => { hideMenu(); post({cmd: "openExternal", path: menuPath, with: true}); };
document.getElementById("m-terminal").onclick = () => { hideMenu(); post({cmd: "openTerminal", path: menuPath}); };
document.getElementById("m-copy").onclick = () => { hideMenu(); post({cmd: "copyFile", path: menuPath}); };
document.getElementById("m-copypath").onclick = () => { hideMenu(); post({cmd: "copyPath", path: menuPath}); };

// Short notes ("Copied the path"): in a pane's bar, or at the foot of the tree.
const flashTimers = new Map();
function onFlash(msg) {
  const p = msg.pane != null ? paneEls.get(msg.pane) : null;
  const el = p ? p.group.querySelector(".pflash") : document.getElementById("flash");
  if (!el) return;
  el.textContent = msg.text;
  el.classList.remove("hidden");
  clearTimeout(flashTimers.get(el));
  flashTimers.set(el, setTimeout(() => el.classList.add("hidden"), 1800));
}
document.addEventListener("mousedown", (e) => { if (!menu.contains(e.target)) hideMenu(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideMenu(); });
window.addEventListener("blur", hideMenu);

document.getElementById("update").onclick = () => post({cmd: "restart"});

const filterBtn = document.getElementById("filter");
const fpanel = document.getElementById("fpanel");
let filters = {showHidden: false, hideIgnored: false, viewableOnly: false, excludes: []};
function showFilter() {
  const active = filters.showHidden || filters.hideIgnored || filters.viewableOnly || filters.excludes.length > 0;
  filterBtn.classList.toggle("on", active);
  document.getElementById("f-hidden").checked = filters.showHidden;
  document.getElementById("f-ignored").checked = filters.hideIgnored;
  document.getElementById("f-viewable").checked = filters.viewableOnly;
  document.getElementById("f-excludes").value = filters.excludes.join("\n");
}
function sendFilters() {
  post({cmd: "setFilters",
        show_hidden: document.getElementById("f-hidden").checked,
        hide_ignored: document.getElementById("f-ignored").checked,
        viewable_only: document.getElementById("f-viewable").checked,
        excludes: document.getElementById("f-excludes").value.split(/\r?\n/)});
}
filterBtn.onclick = () => { if (!fpanel.classList.toggle("hidden")) { spanel.classList.add("hidden"); document.getElementById("gear").classList.remove("on"); } };
for (const id of ["f-hidden", "f-ignored", "f-viewable"]) document.getElementById(id).onchange = sendFilters;
document.getElementById("f-apply").onclick = sendFilters;
function relistAll() {
  for (const [p, n] of nodes) if (n.dataset.dir && loaded.has(p)) post({cmd: "list", path: p});
}
document.getElementById("add").onclick = () => post({cmd: "addRoot"});
// Settings panel (global: saved to settings.json, picked up by every window).
let settings = {viewable_exts: [], doc_width: "wide"};
const spanel = document.getElementById("spanel");
function showSettings() {
  for (const r of document.querySelectorAll('input[name="s-width"]')) r.checked = r.value === settings.doc_width;
  for (const r of document.querySelectorAll('input[name="s-office"]')) r.checked = r.value === (settings.office_view || "auto");
  // Types switched with the PDF / PREVIEW button, each with a way to undo it.
  const types = document.getElementById("s-types");
  types.replaceChildren();
  for (const [ext, how] of Object.entries(settings.office_by_type || {})) {
    const row = document.createElement("div");
    row.className = "stype";
    row.textContent = "." + ext + ": " + (how === "libreoffice" ? "LibreOffice (PDF)" : "Windows previewer") + " ";
    const x = document.createElement("button");
    x.textContent = "\u00d7";
    x.title = "Forget this choice";
    x.onclick = () => {
      const m = Object.assign({}, settings.office_by_type);
      delete m[ext];
      post({cmd: "setSettings", settings: Object.assign({}, settings, {office_by_type: m})});
    };
    row.append(x);
    types.append(row);
  }
  document.getElementById("s-exts").value = settings.viewable_exts.join(" ");
}
document.getElementById("gear").onclick = () => {
  const open = spanel.classList.toggle("hidden") === false;
  document.getElementById("gear").classList.toggle("on", open);
  if (open) { fpanel.classList.add("hidden"); showSettings(); }
};
document.getElementById("s-apply").onclick = () => {
  const w = document.querySelector('input[name="s-width"]:checked');
  post({cmd: "setSettings", settings: {
    viewable_exts: document.getElementById("s-exts").value.split(/[\s,;]+/).filter(Boolean),
    doc_width: w ? w.value : "wide",
    office_view: (document.querySelector('input[name="s-office"]:checked') || {value: "auto"}).value,
    office_by_type: settings.office_by_type || {}}});
};
// The mouse's own back/forward buttons, when the pointer is over the sidebar.
document.addEventListener("mouseup", (e) => {
  if (e.button === 3 || e.button === 4) { post({cmd: e.button === 3 ? "back" : "forward"}); e.preventDefault(); }
});

// Splitter.
const split = document.getElementById("split");
let pending = null;
function setWidth(w) { document.documentElement.style.setProperty("--w", w + "px"); }
split.addEventListener("pointerdown", (e) => {
  split.setPointerCapture(e.pointerId);
  split.classList.add("drag");
});
split.addEventListener("pointermove", (e) => {
  if (!split.hasPointerCapture(e.pointerId)) return;
  const w = Math.max(140, Math.min(e.clientX, window.innerWidth - 200));
  setWidth(w);
  if (pending === null) {
    pending = requestAnimationFrame(() => { pending = null; post({cmd: "sidebar", width: w, dpr: devicePixelRatio}); });
  }
});
split.addEventListener("pointerup", (e) => {
  split.releasePointerCapture(e.pointerId);
  split.classList.remove("drag");
  const w = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--w"));
  post({cmd: "sidebar", width: w, dpr: devicePixelRatio});
});
function currentWidth() { return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--w")); }
let lastDpr = 0;
window.addEventListener("resize", () => {
  if (devicePixelRatio !== lastDpr) { lastDpr = devicePixelRatio; post({cmd: "sidebar", width: currentWidth(), dpr: devicePixelRatio}); }
});

window.condor = {
  recv(msg) {
    switch (msg.ev) {
      case "update": document.getElementById("update").classList.remove("hidden"); break;
      case "settings":
        settings = msg.settings;
        if (spanel.classList.contains("hidden")) showSettings();
        for (const n of nodes.values()) decorate(n);
        break;
      case "tags": onTags(msg); break;
      case "layout": onLayout(msg); break;
      case "pane": onPane(msg); break;
      case "history": onHistory(msg); break;
      case "init":
        document.getElementById("update").classList.toggle("hidden", !msg.update);
        expanded = new Set(msg.expanded);
        selected = msg.selected;
        reveal = !!selected;
        roots = msg.roots;
        setWidth(msg.sidebar);
        filters = msg.filters; showFilter();
        canOpenWith = !!msg.openWith;
        settings = msg.settings; showSettings();
        STAR = msg.star || STAR;
        showable = new Set(msg.showable || []);
        tags = msg.tags || {};
        tagFilter = msg.tagFilter || [];
        treeMode = "";
        renderTagbar();
        lastDpr = devicePixelRatio;
        post({cmd: "sidebar", width: msg.sidebar, dpr: devicePixelRatio});
        renderRoots();
        break;
      case "roots":
        if (msg.expanded) expanded = new Set(msg.expanded);
        roots = msg.roots;
        renderRoots();
        break;
      case "list": onList(msg); break;
      case "results": onResults(msg); break;
      case "selected": select(msg.path); break;
      case "banner": onBanner(msg); break;
      case "flash": onFlash(msg); break;
      case "filter": filters = msg.filters; showFilter(); relistAll(); break;
    }
  }
};
post({cmd: "ready"});
</script>
</body>
</html>
