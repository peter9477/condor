<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Condor</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f7f7f8; --fg: #1f2328; --muted: #6e7781; --hover: #e8eaed; --sel: #d0e3ff; --cursor: #0969da;
  --border: #d0d7de; --split: #e1e4e8;
  --w: 300px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #181a1f; --fg: #d6dbe1; --muted: #8b949e; --hover: #262a31; --sel: #1f3b63; --cursor: #4493f8;
          --border: #30363d; --split: #2a2e35; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
  font: 13px/1.4 "Segoe UI", system-ui, sans-serif; user-select: none; }
#side { position: absolute; left: 0; top: 0; bottom: 0; width: var(--w); display: flex; flex-direction: column; }
#bar { display: flex; align-items: center; gap: 4px; padding: 6px 8px; border-bottom: 1px solid var(--border); }
#bar .title { flex: 1; font-weight: 600; color: var(--muted); letter-spacing: .04em; font-size: 11px; text-transform: uppercase;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
#bar button { border: 0; background: none; color: var(--fg); font: inherit; font-size: 15px; width: 26px; height: 24px;
  border-radius: 4px; cursor: pointer; }
#bar button:hover { background: var(--hover); }
#bar button.on { background: var(--sel); color: var(--cursor); }
#tree { flex: 1; overflow: auto; padding: 4px 0 24px; outline: none; }
#split { position: absolute; top: 0; bottom: 0; left: var(--w); width: 5px; cursor: col-resize; background: var(--split); }
#split:hover, #split.drag { background: var(--cursor); }
/* Shows through the 1px gap above the content view, and edges the splitter, framing the document pane. */
#pane { position: absolute; left: calc(var(--w) + 5px); right: 0; top: 0; bottom: 0; background: var(--border); }
#split { box-shadow: inset -1px 0 var(--border); }
.row { display: flex; align-items: center; height: 22px; padding-right: 6px; white-space: nowrap; cursor: default; border: 1px solid transparent; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--sel); }
#tree:focus .row.cursor { border-color: var(--cursor); }
.tw { width: 16px; flex: none; text-align: center; color: var(--muted); font-size: 10px; }
.name { overflow: hidden; text-overflow: ellipsis; }
.root > .row { font-weight: 600; margin-top: 2px; }
.root > .row .full { font-weight: 400; color: var(--muted); margin-left: 6px; overflow: hidden; text-overflow: ellipsis; }
.row .x { margin-left: auto; visibility: hidden; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 4px; font-size: 14px; }
.root > .row:hover .x { visibility: visible; }
.row .x:hover { color: var(--fg); }
.note { color: var(--muted); font-style: italic; }
.err { color: #cf222e; font-style: italic; }
.hidden { display: none !important; }
#empty { padding: 24px 16px; color: var(--muted); }
#empty button { margin-top: 8px; font: inherit; padding: 4px 10px; }
#fpanel { padding: 8px 10px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
#fpanel label { display: flex; align-items: center; gap: 6px; }
#fpanel .flabel { margin-top: 4px; color: var(--muted); }
#fpanel textarea { width: 100%; font: 12px ui-monospace, Consolas, monospace; resize: vertical; background: var(--bg);
  color: var(--fg); border: 1px solid var(--border); border-radius: 4px; padding: 4px; user-select: text; }
#fpanel .fbtns { display: flex; justify-content: flex-end; }
#fpanel button { font: inherit; padding: 2px 12px; }
#banner { position: absolute; left: calc(var(--w) + 5px); right: 0; top: 0; height: 34px; display: flex; align-items: center;
  gap: 8px; padding: 0 10px; background: #fff8c5; color: #3b2300; border-bottom: 1px solid #d4a72c; white-space: nowrap; overflow: hidden; }
@media (prefers-color-scheme: dark) { #banner { background: #3a2f0b; color: #f2e3b3; border-color: #9e6a03; } }
#banner.info { background: #ddf4ff; color: #0a3069; border-color: #54aeff; }
#banner.info button { border-color: #0969da; }
#banner.info button:hover { background: rgba(9,105,218,.15); }
@media (prefers-color-scheme: dark) { #banner.info { background: #0c2d4a; color: #cae8ff; border-color: #1f6feb; } #banner.info button { border-color: #4493f8; } }
#menu { position: fixed; z-index: 10; min-width: 150px; padding: 4px 0; background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
#menu button { display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--fg); font: inherit; padding: 4px 14px; cursor: pointer; }
#menu button:hover { background: var(--hover); }
#banner .msg { overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
#banner button { font: inherit; padding: 2px 10px; border-radius: 4px; border: 1px solid #bf8700; background: transparent; color: inherit; cursor: pointer; }
#banner button:hover { background: rgba(191,135,0,.2); }
#banner .close { margin-left: auto; border: 0; font-size: 16px; padding: 0 6px; }
#bar #update { width: auto; padding: 0 8px; font-size: 12px; background: #1f883d; color: #fff; border-radius: 12px; margin-right: 4px; }
#bar #update:hover { background: #1a7f37; }
#bar #auto { font-size: 11px; width: auto; padding: 0 5px; }
#bar #src { font-size: 11px; width: auto; padding: 0 5px; font-family: ui-monospace, Consolas, monospace; }
#bar #auto:disabled, #bar #back:disabled, #bar #fwd:disabled { opacity: .35; cursor: default; }
#bar #back:disabled:hover, #bar #fwd:disabled:hover { background: none; }
.dragover > .row { box-shadow: inset 0 2px 0 var(--cursor); }
</style>
</head>
<body>
<div id="side">
  <div id="bar">
    <span class="title" id="envname">Condor</span>
    <button id="update" class="hidden" title="A new version of Condor is installed: restart into it (keeps your place)">Restart</button>
    <button id="back" title="Back (Alt+Left)">&#x2190;</button>
    <button id="fwd" title="Forward (Alt+Right)">&#x2192;</button>
    <button id="src" class="hidden" title="View source (Ctrl+U)">&lt;/&gt;</button>
    <button id="auto" title="Reload the open file automatically when it changes" disabled>AUTO</button>
    <button id="filter" title="Filters: hidden files, file types, exclusions">&#x29e9;</button>
    <button id="add" title="Add a folder (root)">+</button>
    <button id="reload" title="Reload the open file (F5)">&#x21bb;</button>
  </div>
  <div id="fpanel" class="hidden">
    <label><input type="checkbox" id="f-hidden"> Show hidden files (dot files)</label>
    <label><input type="checkbox" id="f-ignored"> Hide git-ignored files</label>
    <label><input type="checkbox" id="f-viewable"> Only viewable file types</label>
    <div class="flabel">Exclude (one pattern per line, .gitignore syntax):</div>
    <textarea id="f-excludes" rows="4" spellcheck="false" placeholder="node_modules/&#10;target/&#10;*.lock"></textarea>
    <div class="fbtns"><button id="f-apply">Apply</button></div>
  </div>
  <div id="tree" tabindex="0"></div>
</div>
<div id="split"></div>
<div id="pane"></div>
<div id="menu" class="hidden"><button id="m-open">Open</button><button id="m-openwith">Open with&#x2026;</button></div>
<div id="banner" class="hidden">
  <span class="msg" id="bmsg"></span>
  <button id="breload">Reload</button>
  <button id="bauto" title="Reload this file automatically from now on">Always auto-reload this file</button>
  <button id="bopen" title="Open in its default application">Open</button>
  <button id="bopenwith" title="Choose an application to open it with">Open with&#x2026;</button>
  <button class="close" id="bclose" title="Keep viewing this version">&#x00d7;</button>
</div>
<script>
"use strict";
const post = (o) => window.ipc.postMessage(JSON.stringify(o));
const tree = document.getElementById("tree");
const nodes = new Map();      // path -> node element
const loaded = new Set();     // paths whose children have been listed at least once
let expanded = new Set();
let selected = null;
let cursor = null;            // keyboard cursor (a .node element)
let roots = [];
let reveal = false;           // scroll the selected file into view when it first appears

function baseName(p) {
  const t = p.replace(/[\\/]+$/, "");
  const i = Math.max(t.lastIndexOf("\\"), t.lastIndexOf("/"));
  return i >= 0 ? t.slice(i + 1) || t : t;
}

function makeNode(path, name, dir, depth, isRoot) {
  const n = document.createElement("div");
  n.className = "node" + (isRoot ? " root" : "");
  n.dataset.path = path;
  n.dataset.dir = dir ? "1" : "";
  n.dataset.depth = depth;
  const row = document.createElement("div");
  row.className = "row";
  row.style.paddingLeft = (depth * 14 + 4) + "px";
  row.title = path;
  const tw = document.createElement("span");
  tw.className = "tw";
  tw.textContent = dir ? "▸" : "";
  const nm = document.createElement("span");
  nm.className = "name";
  nm.textContent = name;
  row.append(tw, nm);
  if (isRoot) {
    const full = document.createElement("span");
    full.className = "full name";
    full.textContent = path;
    const x = document.createElement("button");
    x.className = "x";
    x.title = "Remove this folder from the list";
    x.textContent = "×";
    x.addEventListener("click", (e) => { e.stopPropagation(); post({cmd: "removeRoot", path}); });
    row.append(full, x);
    row.draggable = true;
  }
  n.append(row);
  if (dir) {
    const kids = document.createElement("div");
    kids.className = "kids hidden";
    n.append(kids);
  }
  if (path === selected) {
    row.classList.add("sel");
    if (reveal) { reveal = false; setTimeout(() => { row.scrollIntoView({block: "center"}); setCursor(n, false); }, 0); }
  }
  nodes.set(path, n);
  return n;
}

function kidsOf(n) { return n.querySelector(":scope > .kids"); }
function rowOf(n) { return n.querySelector(":scope > .row"); }

function setOpen(n, open, user) {
  if (!n.dataset.dir) return;
  const path = n.dataset.path;
  const kids = kidsOf(n);
  kids.classList.toggle("hidden", !open);
  rowOf(n).querySelector(".tw").textContent = open ? "▾" : "▸";
  if (open) {
    if (!loaded.has(path) && !kids.firstChild) {
      const l = document.createElement("div");
      l.className = "row note";
      l.style.paddingLeft = ((+n.dataset.depth + 1) * 14 + 20) + "px";
      l.textContent = "loading…";
      kids.append(l);
    }
    // Always re-list on expand so the tree picks up changes on disk.
    post({cmd: "list", path});
  }
  if (user) {
    if (open) expanded.add(path); else expanded.delete(path);
    post({cmd: "expand", path, open});
  }
}

function onList(msg) {
  const n = nodes.get(msg.path);
  if (!n) return;
  const kids = kidsOf(n);
  const depth = +n.dataset.depth + 1;
  loaded.add(msg.path);
  if (msg.error) {
    kids.replaceChildren();
    const e = document.createElement("div");
    e.className = "row err";
    e.style.paddingLeft = (depth * 14 + 20) + "px";
    e.textContent = msg.error;
    e.title = msg.error;
    kids.append(e);
    return;
  }
  // Reuse existing child nodes so their own expanded subtrees survive a refresh.
  const old = new Map();
  for (const c of kids.children) if (c.dataset && c.dataset.path) old.set(c.dataset.path, c);
  const frag = [];
  for (const ent of msg.entries) {
    let c = old.get(ent.path);
    if (c && !!c.dataset.dir === ent.dir) {
      old.delete(ent.path);
    } else {
      c = makeNode(ent.path, ent.name, ent.dir, depth, false);
      if (ent.dir && expanded.has(ent.path)) setOpen(c, true, false);
    }
    frag.push(c);
  }
  for (const [p, c] of old) forget(c);
  kids.replaceChildren(...frag);
  if (!msg.entries.length) {
    const e = document.createElement("div");
    e.className = "row note";
    e.style.paddingLeft = (depth * 14 + 20) + "px";
    e.textContent = "(empty)";
    kids.append(e);
  }
  if (cursor && !cursor.isConnected) cursor = null;
  if (revealing && isWithin(revealing, msg.path)) revealStep();
}

function forget(n) {
  for (const d of n.querySelectorAll(".node")) nodes.delete(d.dataset.path);
  nodes.delete(n.dataset.path);
}

function renderRoots() {
  const keep = new Map();
  for (const c of tree.children) if (c.dataset && c.dataset.path) keep.set(c.dataset.path, c);
  const els = [];
  for (const r of roots) {
    let n = keep.get(r);
    if (n) keep.delete(r);
    else {
      n = makeNode(r, baseName(r), true, 0, true);
      if (expanded.has(r)) setOpen(n, true, false);
    }
    els.push(n);
  }
  for (const [, n] of keep) forget(n);
  tree.replaceChildren(...els);
  if (!roots.length) {
    const e = document.createElement("div");
    e.id = "empty";
    e.innerHTML = "No folders yet.<br>";
    const b = document.createElement("button");
    b.textContent = "Add a folder…";
    b.onclick = () => post({cmd: "addRoot"});
    e.append(b);
    tree.append(e);
  }
}

function select(path) {
  if (selected && nodes.get(selected)) rowOf(nodes.get(selected)).classList.remove("sel");
  selected = path;
  const n = path && nodes.get(path);
  if (n) {
    rowOf(n).classList.add("sel");
    if (!cursor) setCursor(n, false);
  }
  revealPath(path);
}

// Expand the folders leading to `path` (listing them as needed) and scroll it into view,
// e.g. after following a link in a document. Stops quietly if a filter hides it.
let revealing = null, revealLast = null;
function keyOf(p) { return p.toLowerCase().replace(/[\\/]+$/, ""); }
function isWithin(p, a) {
  const kp = keyOf(p), ka = keyOf(a);
  return kp === ka || kp.startsWith(ka + "\\") || kp.startsWith(ka + "/");
}
function revealPath(path) {
  revealing = path || null;
  revealLast = null;
  revealStep();
}
function revealStep() {
  if (!revealing) return;
  let best = null;
  for (const [p, n] of nodes) {
    if (n.isConnected && isWithin(revealing, p) && (!best || p.length > best.dataset.path.length)) best = n;
  }
  if (!best) { revealing = null; return; }
  if (keyOf(best.dataset.path) === keyOf(revealing)) {
    revealing = null;
    const row = rowOf(best);
    if (row.offsetParent !== null) row.scrollIntoView({block: "nearest"});
    return;
  }
  // Already opened and listed this folder, and the target isn't in it: give up.
  if (best === revealLast && loaded.has(best.dataset.path)) { revealing = null; return; }
  revealLast = best;
  const open = !kidsOf(best).classList.contains("hidden");
  if (!open) setOpen(best, true, true);           // its listing arrives in onList, which calls us
  else if (loaded.has(best.dataset.path)) revealStep();
}

function setCursor(n, scroll) {
  if (cursor && cursor.isConnected) rowOf(cursor).classList.remove("cursor");
  cursor = n;
  if (n) {
    rowOf(n).classList.add("cursor");
    if (scroll) rowOf(n).scrollIntoView({block: "nearest"});
  }
}

function activate(n) {
  if (n.dataset.dir) setOpen(n, kidsOf(n).classList.contains("hidden"), true);
  else post({cmd: "open", path: n.dataset.path});
}

tree.addEventListener("click", (e) => {
  const row = e.target.closest(".row");
  if (!row || !row.parentElement.classList.contains("node")) return;
  const n = row.parentElement;
  setCursor(n, false);
  activate(n);
});

function visibleNodes() {
  const out = [];
  const walk = (container) => {
    for (const c of container.children) {
      if (!c.classList || !c.classList.contains("node")) continue;
      out.push(c);
      const k = kidsOf(c);
      if (k && !k.classList.contains("hidden")) walk(k);
    }
  };
  walk(tree);
  return out;
}

tree.addEventListener("keydown", (e) => {
  if (e.altKey) return; // Alt+arrows are back/forward
  const vis = visibleNodes();
  if (!vis.length) return;
  let i = cursor ? vis.indexOf(cursor) : -1;
  const n = cursor;
  switch (e.key) {
    case "ArrowDown": setCursor(vis[Math.min(i + 1, vis.length - 1)], true); break;
    case "ArrowUp": setCursor(vis[Math.max(i - 1, 0)], true); break;
    case "Home": setCursor(vis[0], true); break;
    case "End": setCursor(vis[vis.length - 1], true); break;
    case "PageDown": setCursor(vis[Math.min(i + 20, vis.length - 1)], true); break;
    case "PageUp": setCursor(vis[Math.max(i - 20, 0)], true); break;
    case "ArrowRight":
      if (n && n.dataset.dir) {
        if (kidsOf(n).classList.contains("hidden")) setOpen(n, true, true);
        else if (vis[i + 1] && vis[i + 1].parentElement === kidsOf(n)) setCursor(vis[i + 1], true);
      }
      break;
    case "ArrowLeft":
      if (n && n.dataset.dir && !kidsOf(n).classList.contains("hidden")) setOpen(n, false, true);
      else if (n && n.parentElement.classList.contains("kids")) setCursor(n.parentElement.parentElement, true);
      break;
    case "Enter": case " ": if (n) activate(n); break;
    case "F5": post({cmd: "reload"}); break;
    default: return;
  }
  e.preventDefault();
});

document.addEventListener("keydown", (e) => {
  if (e.ctrlKey && !e.altKey && !e.shiftKey && (e.key === "u" || e.key === "U")) {
    post({cmd: "toggleSource"});
    e.preventDefault();
    return;
  }
  if (e.altKey && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
    post({cmd: e.key === "ArrowLeft" ? "back" : "forward"});
    e.preventDefault();
    return;
  }
  if (e.key === "F5" && e.target !== tree) { post({cmd: "reload"}); e.preventDefault(); }
});

// Reorder roots by dragging their header rows.
let dragRoot = null;
tree.addEventListener("dragstart", (e) => {
  const n = e.target.closest && e.target.closest(".root");
  if (!n) return;
  dragRoot = n.dataset.path;
  e.dataTransfer.effectAllowed = "move";
});
tree.addEventListener("dragover", (e) => {
  const n = e.target.closest && e.target.closest(".root");
  if (!dragRoot || !n) return;
  e.preventDefault();
  for (const r of tree.querySelectorAll(".dragover")) r.classList.remove("dragover");
  n.classList.add("dragover");
});
tree.addEventListener("drop", (e) => {
  const n = e.target.closest && e.target.closest(".root");
  for (const r of tree.querySelectorAll(".dragover")) r.classList.remove("dragover");
  if (!dragRoot || !n) return;
  e.preventDefault();
  let to = roots.indexOf(n.dataset.path);
  post({cmd: "moveRoot", path: dragRoot, to});
  dragRoot = null;
});
tree.addEventListener("dragend", () => { dragRoot = null; });

// Changed-on-disk banner and per-file auto-reload.
const banner = document.getElementById("banner");
const autoBtn = document.getElementById("auto");
let autoOn = false;
function showAuto() {
  autoBtn.disabled = !selected;
  autoBtn.classList.toggle("on", autoOn);
  autoBtn.title = autoOn ? "This file reloads automatically when it changes (click to stop)"
                         : "Reload the open file automatically when it changes";
}
autoBtn.onclick = () => { if (selected) post({cmd: "autoReload", path: selected, on: !autoOn}); };
document.getElementById("breload").onclick = () => post({cmd: "reload"});
document.getElementById("bauto").onclick = () => { if (selected) post({cmd: "autoReload", path: selected, on: true}); };
document.getElementById("bclose").onclick = () => post({cmd: "dismiss"});
let bannerPath = null;
function showBanner(msg) {
  banner.classList.toggle("hidden", !msg.show);
  if (!msg.show) return;
  bannerPath = msg.path;
  const name = baseName(msg.path);
  const open = msg.kind === "open";
  banner.classList.toggle("info", open);
  document.getElementById("bmsg").textContent = open ? "Condor can't show " + name + "."
    : msg.deleted ? name + " was deleted or moved. You are viewing the last version loaded."
    : name + " has changed on disk.";
  document.getElementById("breload").classList.toggle("hidden", open || !!msg.deleted);
  document.getElementById("bauto").classList.toggle("hidden", open || !!msg.deleted);
  document.getElementById("bopen").classList.toggle("hidden", !open);
  document.getElementById("bopenwith").classList.toggle("hidden", !open || !msg.openWith);
}
document.getElementById("bopen").onclick = () => post({cmd: "openExternal", path: bannerPath, with: false});
document.getElementById("bopenwith").onclick = () => post({cmd: "openExternal", path: bannerPath, with: true});

// Right-click a file in the tree: open it in another application.
let canOpenWith = false, menuPath = null;
const menu = document.getElementById("menu");
function hideMenu() { menu.classList.add("hidden"); }
tree.addEventListener("contextmenu", (e) => {
  e.preventDefault();
  const row = e.target.closest(".row");
  const n = row && row.parentElement;
  if (!n || !n.classList.contains("node") || n.dataset.dir) { hideMenu(); return; }
  menuPath = n.dataset.path;
  document.getElementById("m-openwith").classList.toggle("hidden", !canOpenWith);
  menu.classList.remove("hidden");
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.min(e.clientX, innerWidth - r.width - 4) + "px";
  menu.style.top = Math.min(e.clientY, innerHeight - r.height - 4) + "px";
});
document.getElementById("m-open").onclick = () => { hideMenu(); post({cmd: "openExternal", path: menuPath, with: false}); };
document.getElementById("m-openwith").onclick = () => { hideMenu(); post({cmd: "openExternal", path: menuPath, with: true}); };
document.addEventListener("mousedown", (e) => { if (!menu.contains(e.target)) hideMenu(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideMenu(); });
window.addEventListener("blur", hideMenu);

document.getElementById("update").onclick = () => post({cmd: "restart"});

const filterBtn = document.getElementById("filter");
const fpanel = document.getElementById("fpanel");
let filters = {showHidden: false, hideIgnored: false, viewableOnly: false, excludes: []};
function showFilter() {
  const active = filters.showHidden || filters.hideIgnored || filters.viewableOnly || filters.excludes.length > 0;
  filterBtn.classList.toggle("on", active);
  document.getElementById("f-hidden").checked = filters.showHidden;
  document.getElementById("f-ignored").checked = filters.hideIgnored;
  document.getElementById("f-viewable").checked = filters.viewableOnly;
  document.getElementById("f-excludes").value = filters.excludes.join("\n");
}
function sendFilters() {
  post({cmd: "setFilters",
        show_hidden: document.getElementById("f-hidden").checked,
        hide_ignored: document.getElementById("f-ignored").checked,
        viewable_only: document.getElementById("f-viewable").checked,
        excludes: document.getElementById("f-excludes").value.split(/\r?\n/)});
}
filterBtn.onclick = () => fpanel.classList.toggle("hidden");
for (const id of ["f-hidden", "f-ignored", "f-viewable"]) document.getElementById(id).onchange = sendFilters;
document.getElementById("f-apply").onclick = sendFilters;
function relistAll() {
  for (const [p, n] of nodes) if (n.dataset.dir && loaded.has(p)) post({cmd: "list", path: p});
}
document.getElementById("add").onclick = () => post({cmd: "addRoot"});
document.getElementById("reload").onclick = () => post({cmd: "reload"});
document.getElementById("back").onclick = () => post({cmd: "back"});
document.getElementById("src").onclick = () => post({cmd: "toggleSource"});
document.getElementById("fwd").onclick = () => post({cmd: "forward"});
// The mouse's own back/forward buttons, when the pointer is over the sidebar.
document.addEventListener("mouseup", (e) => {
  if (e.button === 3 || e.button === 4) { post({cmd: e.button === 3 ? "back" : "forward"}); e.preventDefault(); }
});

// Splitter.
const split = document.getElementById("split");
let pending = null;
function setWidth(w) { document.documentElement.style.setProperty("--w", w + "px"); }
split.addEventListener("pointerdown", (e) => {
  split.setPointerCapture(e.pointerId);
  split.classList.add("drag");
});
split.addEventListener("pointermove", (e) => {
  if (!split.hasPointerCapture(e.pointerId)) return;
  const w = Math.max(140, Math.min(e.clientX, window.innerWidth - 200));
  setWidth(w);
  if (pending === null) {
    pending = requestAnimationFrame(() => { pending = null; post({cmd: "sidebar", width: w, dpr: devicePixelRatio}); });
  }
});
split.addEventListener("pointerup", (e) => {
  split.releasePointerCapture(e.pointerId);
  split.classList.remove("drag");
  const w = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--w"));
  post({cmd: "sidebar", width: w, dpr: devicePixelRatio});
});
function currentWidth() { return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--w")); }
let lastDpr = 0;
window.addEventListener("resize", () => {
  if (devicePixelRatio !== lastDpr) { lastDpr = devicePixelRatio; post({cmd: "sidebar", width: currentWidth(), dpr: devicePixelRatio}); }
});

window.condor = {
  recv(msg) {
    switch (msg.ev) {
      case "update": document.getElementById("update").classList.remove("hidden"); break;
      case "view": {
        const b = document.getElementById("src");
        b.classList.toggle("hidden", !msg.can);
        b.classList.toggle("on", !!msg.source);
        b.title = msg.source ? "Show the rendered view (Ctrl+U)" : "View source (Ctrl+U)";
        break;
      }
      case "history":
        document.getElementById("back").disabled = !msg.back;
        document.getElementById("fwd").disabled = !msg.forward;
        break;
      case "init":
        document.getElementById("update").classList.toggle("hidden", !msg.update);
        expanded = new Set(msg.expanded);
        selected = msg.selected;
        reveal = !!selected;
        roots = msg.roots;
        setWidth(msg.sidebar);
        filters = msg.filters; showFilter();
        canOpenWith = !!msg.openWith;
        lastDpr = devicePixelRatio;
        post({cmd: "sidebar", width: msg.sidebar, dpr: devicePixelRatio});
        document.getElementById("envname").textContent = msg.env === "default" ? "Condor" : msg.env;
        renderRoots();
        break;
      case "roots":
        if (msg.expanded) expanded = new Set(msg.expanded);
        roots = msg.roots;
        renderRoots();
        break;
      case "list": onList(msg); break;
      case "selected": select(msg.path); autoOn = !!msg.auto; showAuto(); break;
      case "auto": if (msg.path === selected) { autoOn = msg.on; showAuto(); } break;
      case "banner": showBanner(msg); break;
      case "filter": filters = msg.filters; showFilter(); relistAll(); break;
    }
  }
};
post({cmd: "ready"});
</script>
</body>
</html>
